<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Uncover</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="container"><a class="brand" href="index.html"><span class="brand-mark"></span>Uncover</a><a class="btn outline" href="index.html">← Home</a></div></header><main class="auth"><div class="auth-card"><p class="eyebrow">Welcome back</p><h1>Log in</h1><p class="muted">Your conversations stay private until you both choose to reveal.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required placeholder="Your password"></div><button class="btn dark full" type="submit">Log in</button></form><p id="status" class="muted" style="margin-top:16px"></p><p class="muted" style="text-align:center">New to Uncover? <a href="signup.html"><b>Sign up</b></a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
(async()=>{try{const user=await UncoverAuth.getUser();if(user){const params=new URLSearchParams(window.location.search);if(params.has('code')||window.location.hash.includes('access_token')){window.location.href='app.html';}}}catch(_){}})();
</script><script>
document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Signing you in…';try{await UncoverAuth.signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);window.location.href='app.html';}catch(err){status.textContent=err.message||'Could not log in.';}});
</script></body></html>
