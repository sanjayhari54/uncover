<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — Uncover</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="container"><a class="brand" href="index.html"><span class="brand-mark"></span>Uncover</a><a class="btn outline" href="index.html">← Home</a></div></header><main class="auth"><div class="auth-card"><p class="eyebrow">Start your journey</p><h1>Create account</h1><p class="muted">18+ only. Your first 3 private conversations are free.</p><form id="signupForm"><div class="field"><label for="displayName">Display name</label><input id="displayName" required maxlength="40" placeholder="How you'd like to be known"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="8" placeholder="At least 8 characters"></div><label style="font-size:13px;display:block"><input id="adult" type="checkbox" required> I confirm I am 18 or older and agree to the community rules.</label><button class="btn dark full" style="margin-top:20px" type="submit">Create account</button></form><p id="status" class="muted" style="margin-top:16px"></p><p class="muted" style="text-align:center">Already have an account? <a href="login.html"><b>Log in</b></a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
document.getElementById('signupForm').addEventListener('submit', async (e)=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Creating your secure account…';try{const data=await UncoverAuth.signUp({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,display_name:document.getElementById('displayName').value.trim()});if(data.session){window.location.href='app.html';}else{status.textContent='Account created. Check your email to confirm your account, then log in.';}}catch(err){status.textContent=err.message||'Could not create the account.';}});
</script></body></html>
